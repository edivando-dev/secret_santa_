<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relizar sorteio</title>
</head>
<body>
    <h2>Detalhes do Grupo:{{ grupo.nome }}</h2>
    <ul>
        {% for participante in grupo.participantes.all  %}
        <li>{{ participante.usuario.username }}</li>
        {% empty %}
        <li>Nenhum participante neste grupo ainda.</li>
        {% endfor %}
    </ul>
    <hr>

    <form action="{% url 'realizar_sorteio' pk=grupo.pk %}">
        {% csrf_token %}
        <p>Clique abaixo para realizar o sorteio. Esta ação não pode ser desfeita!</p>
        <button type="submit">Realizar Sorteio</button>
    </form>

</body>
</html>
